<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src data:">
<title>NASsurfer</title>
<style>
  :root { --ink:#24303d; --muted:#667385; --line:#e3e8ee; --accent:#1f6fd1; --bg:#f5f7fa; }
  * { box-sizing:border-box; }
  body { margin:0; font:14px/1.5 -apple-system,"Segoe UI",Roboto,"Helvetica Neue",sans-serif; color:var(--ink); background:var(--bg); }
  main { max-width:720px; margin:0 auto; padding:48px 28px; }
  h1 { font-size:22px; font-weight:600; margin:0 0 6px; letter-spacing:-.01em; }
  .lead { color:var(--muted); margin:0 0 28px; }
  h2 { font-size:12px; text-transform:uppercase; letter-spacing:.08em; color:var(--muted); margin:28px 0 10px; font-weight:600; }
  ul { list-style:none; margin:0; padding:0; background:#fff; border:1px solid var(--line); border-radius:8px; overflow:hidden; }
  li + li { border-top:1px solid var(--line); }
  button.link { all:unset; display:block; width:100%; padding:11px 16px; cursor:pointer; color:var(--accent); word-break:break-all; }
  button.link:hover, button.link:focus-visible { background:#eef4fc; outline:none; }
  .tips li { padding:11px 16px; color:var(--ink); }
  .tips b { font-weight:600; }
  .note { margin-top:28px; font-size:12.5px; color:var(--muted); }
</style>
</head>
<body>
<main>
  <h1 id="h">NASsurfer</h1>
  <p class="lead" id="lead"></p>
  <section id="recentBox" hidden>
    <h2 id="recentH"></h2>
    <ul id="recent"></ul>
  </section>
  <h2 id="tipsH"></h2>
  <ul class="tips" id="tips"></ul>
  <p class="note" id="note"></p>
  <p class="note" id="src">NASsurfer · AGPL-3.0 · https://github.com/soleil0815/nassurfer</p>
</main>
<script>
(function () {
  var data = {};
  try { data = JSON.parse(decodeURIComponent(location.hash.slice(1))) || {}; } catch (e) {}
  var de = /^(ger|deu|de)/.test(String(data.lang || ""));
  var t = de ? {
    lead: "Ein echter Browser (Chromium), der auf deiner NAS läuft – für Router, Drucker, Proxmox & Co., wenn gerade kein VPN geht.",
    recent: "Zuletzt geöffnet", tips: "So geht's",
    tip: [
      "<b>Adresse oben eingeben</b> und Enter drücken, z. B. <b>192.168.1.1</b> oder <b>https://nextcloud.lan</b>.",
      "Ohne http:// oder https:// wird <b>http://</b> verwendet.",
      "Anmeldungen bei Geräten bleiben gespeichert, bis du sie über <b>⋯</b> löschst.",
      "Kopieren und Einfügen mit <b>Strg+C</b> / <b>Strg+V</b>. Downloads und Datei-Uploads laufen über dein Gerät.",
      "Nach 15 Minuten ohne Nutzung beendet sich der Browser auf der NAS und gibt den Speicher frei."
    ],
    note: "Der Browser läuft auf der NAS unter einem eigenen, eingeschränkten Benutzer. Nur Administratoren können ihn verwenden.",
    src: "NASsurfer ist freie Software unter der AGPL-3.0. Quellcode: https://github.com/soleil0815/nassurfer"
  } : {
    lead: "A real browser (Chromium) running on your NAS – for routers, printers, Proxmox & co. when no VPN is available.",
    recent: "Recently opened", tips: "How it works",
    tip: [
      "<b>Type an address above</b> and press Enter, e.g. <b>192.168.1.1</b> or <b>https://nextcloud.lan</b>.",
      "Without http:// or https://, <b>http://</b> is used.",
      "Sign-ins to devices are kept until you delete them via <b>⋯</b>.",
      "Copy and paste with <b>Ctrl+C</b> / <b>Ctrl+V</b>. Downloads and file uploads go through your device.",
      "After 15 minutes without use the browser on the NAS quits and frees its memory."
    ],
    note: "The browser runs on the NAS under its own restricted user. Only administrators can use it.",
    src: "NASsurfer is free software under the AGPL-3.0. Source code: https://github.com/soleil0815/nassurfer"
  };
  document.documentElement.lang = de ? "de" : "en";
  document.getElementById("lead").textContent = t.lead;
  document.getElementById("recentH").textContent = t.recent;
  document.getElementById("tipsH").textContent = t.tips;
  document.getElementById("note").textContent = t.note;
  document.getElementById("src").textContent = t.src;
  var tips = document.getElementById("tips");
  t.tip.forEach(function (h) { var li = document.createElement("li"); li.innerHTML = h; tips.appendChild(li); });

  var recent = Array.isArray(data.recent) ? data.recent.filter(function (u) { return typeof u === "string" && /^https?:\/\//i.test(u); }) : [];
  if (recent.length) {
    document.getElementById("recentBox").hidden = false;
    var ul = document.getElementById("recent");
    recent.slice(0, 12).forEach(function (u) {
      var li = document.createElement("li"), b = document.createElement("button");
      b.className = "link"; b.type = "button"; b.textContent = u;
      b.addEventListener("click", function () { parent.postMessage({ __bs: 1, type: "go", url: u }, "*"); });
      li.appendChild(b); ul.appendChild(li);
    });
  }
})();
</script>
</body>
</html>
